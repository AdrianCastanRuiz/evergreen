name: Deploy — production

# Every step in this workflow runs under the `production` GitHub Environment,
# which must have a required reviewer configured (repo Settings >
# Environments > production) — the job does not start until someone approves
# it, even after CI has passed (AD-7). Render's production service should
# have auto-deploy-on-push OFF; the deploy hook below is the only path in.
on:
  push:
    branches: [main]

jobs:
  migrate-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    # Job-level, not just on the migrate step: Prisma 7's config file reads
    # these at `prisma generate` time too, which runs as a postinstall hook
    # during `pnpm install` below — scoping the vars to only the migrate
    # step left install unable to resolve them.
    env:
      DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.PRODUCTION_DIRECT_URL }}
    steps:
      - uses: actions/checkout@v4

      # No `version:` here — it's read from package.json's "packageManager"
      # field instead (pnpm/action-setup errors if both are set).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Apply migrations to Neon production branch (AD-6)
        working-directory: apps/api
        run: npx prisma migrate deploy

      - name: Trigger Render production deploy
        run: curl -fsS -X POST "${{ secrets.RENDER_PRODUCTION_DEPLOY_HOOK_URL }}"
